<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1e8" />
    <meta name="description" content="Music theory, sight-reading, rhythm, and ear-training drills." />
    <title>Clef — Music practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Clef home">
          <span class="brand-mark" aria-hidden="true">♪</span>
          <span>clef</span>
        </a>
        <button class="sound-toggle" id="soundToggle" type="button" aria-label="Turn sound off" aria-pressed="true">
          <span class="sound-icon" aria-hidden="true">◖))</span>
          <span class="sound-label">Sound on</span>
        </button>
      </header>

      <section class="intro">
        <div>
          <p class="eyebrow" id="drillCategory">Sight-reading</p>
          <h1 id="trackTitle">Read with <em>confidence.</em></h1>
          <p class="lede" id="drillDescription">Read notation, understand harmony, feel rhythm, and connect the page to sound.</p>
        </div>

        <div>
          <div class="track-picker" id="trackPicker" role="tablist" aria-label="Curriculum track"></div>
          <div class="level-picker" id="drillPicker" role="group" aria-label="Choose a drill"></div>
        </div>
      </section>

      <section class="practice-card" aria-label="Music practice exercise">
        <div class="practice-meta">
          <div class="drill-meta">
            <span class="meta-label">Drill</span>
            <strong id="drillName">First five notes</strong>
            <span class="context-badge" id="contextBadge">Treble · C major</span>
          </div>
          <div class="score-group">
            <div><span class="meta-label">Streak</span><strong id="streak">0</strong></div>
            <div><span class="meta-label">Correct</span><strong><span id="correctCount">0</span><small id="answeredCount">/0</small></strong></div>
            <div><span class="meta-label">Accuracy</span><strong id="accuracy">—</strong></div>
          </div>
        </div>

        <div class="staff-window" id="staffWindow">
          <div class="target-line" aria-hidden="true"><span></span></div>
          <div class="staff" aria-hidden="true">
            <div class="staff-lines">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
            <div class="clef" id="clefSymbol">𝄞</div>
            <div class="key-signature" id="keySignature"></div>
            <div class="notes-track" id="notesTrack"></div>
          </div>
          <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
          <div class="theory-display" id="theoryDisplay" aria-live="polite"></div>
          <button class="replay-button" id="replayButton" type="button" hidden><span aria-hidden="true">▶</span> Play again</button>
        </div>

        <div class="prompt-row">
          <p id="prompt">Which note is at the marker?</p>
          <div class="practice-actions">
            <button id="resetButton" class="reset-button" type="button">Start over <span aria-hidden="true">↻</span></button>
          </div>
        </div>
      </section>

      <section class="answer-section" aria-label="Choose a note">
        <div class="keys" id="noteKeys"></div>
        <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Choose drill" aria-expanded="false">♪</button>
        <p class="keyboard-hint" id="keyboardHint">Tap an answer, or use the number keys</p>
      </section>
    </main>

    <div class="mobile-sheet" id="mobileSheet" hidden>
      <button class="sheet-backdrop" type="button" aria-label="Close drill settings"></button>
      <section class="sheet-panel" aria-label="Drill settings">
        <div class="sheet-heading"><div><p class="eyebrow">Practice setup</p><h2>Choose a drill</h2></div><button class="sheet-close" type="button" aria-label="Close">×</button></div>
        <div class="track-picker mobile-tracks" id="mobileTrackPicker" role="tablist" aria-label="Curriculum track"></div>
        <div class="sheet-drills" id="mobileDrillPicker"></div>
        <div class="sheet-options">
          <button id="mobileSound" type="button" aria-pressed="true">Sound <span>On</span></button>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
